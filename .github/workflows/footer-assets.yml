# Footer assets
# Fails on any result other than pass, e.g. when a footer logo URL returns 404 (issue 47, subissue 50).
# Flag spelling confirmed with `python scripts/showcase.py footer --check --help`: `--check README.md --online`
# HEADs both decision 18 raw logo URLs (on main) and exits non-zero unless both return 200.
# Triggers: pull requests (footer-touching paths), push to main, weekly schedule and manual dispatch all run the online
# HEAD, so a PR cannot merge while a published logo URL returns an error. The PR-only step that checks the configured
# footer logo files exist in the checkout stays as extra coverage for a PR that adds or renames them.
name: Footer assets

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - references/brand.yaml
      - README.md
      - assets/brand/**
      - scripts/ctshowcase/footer.py
      - .github/workflows/footer-assets.yml
  pull_request:
    paths:
      - references/brand.yaml
      - README.md
      - assets/brand/**
      - scripts/ctshowcase/footer.py
      - .github/workflows/footer-assets.yml

permissions:
  contents: read

jobs:
  footer-online:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Footer logo files exist in this checkout
        if: github.event_name == 'pull_request'
        run: |
          python -c "import pathlib, sys, yaml; from urllib.parse import urlparse; f = yaml.safe_load(open('references/brand.yaml', encoding='utf-8'))['footer']; urls = [f['logo_light_url'], f['logo_dark_url']]; bad = [u for u in urls if not pathlib.Path(*urlparse(u).path.split('/main/', 1)[1].split('/')).is_file()]; print('missing in checkout:', bad) if bad else print('footer logo files present:', urls); sys.exit(1 if bad else 0)"
      - name: Real HEAD against footer logo URLs
        run: python scripts/showcase.py footer --check README.md --online
