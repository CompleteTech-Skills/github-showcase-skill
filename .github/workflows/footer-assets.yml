# Footer assets
# Fails on any result other than pass, e.g. when a footer logo URL returns 404 (issue 47, subissue 50).
# Flag spelling confirmed with `python scripts/showcase.py footer --help`: `--check README.md --online`
# HEADs both decision 18 raw logo URLs and exits non-zero unless both return 200.

name: Footer assets

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - references/brand.yaml
      - README.md
      - assets/brand/**
      - scripts/ctshowcase/footer.py
      - .github/workflows/footer-assets.yml

permissions:
  contents: read

jobs:
  footer-online:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Real HEAD against footer logo URLs
        run: python scripts/showcase.py footer --check README.md --online
