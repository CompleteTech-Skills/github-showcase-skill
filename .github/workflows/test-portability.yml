name: Test portability

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Earlier full suites hit 45 minutes on macOS and 60 minutes on Windows before the final CLI cases.
    # Budget for the additional preservation cases and cleanup without dropping any tests.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 75 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1 pytest-xdist==3.8.0 execnet==2.1.2 jsonschema==4.25.1
      - name: Run the full test suite
        # Keep each file together; run every collected test with two local workers.
        run: python -m pytest -q -n 2 --dist loadfile --max-worker-restart 0
