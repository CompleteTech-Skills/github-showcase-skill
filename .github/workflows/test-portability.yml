name: Test portability

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Earlier full suites hit 45 minutes on macOS and 60 minutes on Windows before the final CLI cases.
    # Budget for the additional preservation cases and cleanup without dropping any tests.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 75 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1 jsonschema==4.25.1
      - name: Verify Windows local Git fixture
        if: runner.os == 'Windows'
        # Expose native fixture/setup failures before the long full run; all cases still run in the full inventory.
        run: python -m pytest -q tests/test_provenance_git_transport.py tests/test_provenance_contract_independent.py
      - name: Verify Windows CI runner fixtures
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_pytest_worker_guard.py tests/test_ci_cache_isolation.py
      - name: Run the full test suite
        # Full inventory, whole-file batches, two ordinary local pytest processes.
        run: python scripts/run_ci_tests.py
