name: Test portability

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Older Windows runs already took 24 minutes before the new CLI and transaction coverage.
    # Keep the full suite on every platform, with room for the combined integration and cleanup.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 45 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1 jsonschema==4.25.1
      - name: Run the full test suite
        run: python -m pytest -q
