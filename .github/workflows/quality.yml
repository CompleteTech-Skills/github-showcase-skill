name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.17.2 pyyaml==6.0.3 pytest==9.1.1 jsonschema==4.25.1
      - name: Install diagram and type-check tools
        run: npm install -g @mermaid-js/mermaid-cli pyright
      - name: Verify the bundled OFL fonts
        run: python scripts/showcase.py fonts --check
      - name: Run the test suite
        run: python -m pytest -q
      - name: Run quality validation
        run: python scripts/validate_quality.py
