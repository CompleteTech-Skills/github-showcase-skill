# Example .github/showcase.yml for a repository (schema: references/repo-config.schema.json).
# All keys are optional and change content only; colours and fonts always come from
# references/brand.yaml and are rejected here. This example reproduces the golden
# php2shell-check banner: two CVE key chips, one attribute chip and a short subtitle.
for: CompleTetech-Security/php2shell-check   # these overrides apply only to this repository (a copy ignores them)
type: null                # a §5.4 type (cli, library, web-app, ...) while the file tree cannot show it yet; logged
icon: assets/icon.png
subtitle: "Passive PHP2Shell exposure triage for websites"
category: null            # replaces the eyebrow category (rare; logged)
chips:                    # 1-2 key chips and up to 3 attribute chips; replaces the derived chips (logged rule "override")
  key: ["CVE-2026-109618", "CVE-2026-109619"]
  attrs: ["No exploit payloads"]
variant: null             # README variant A-J; else detected from the repository type
readme: {header: true, footer: true}   # false only together with a reason; doctor then reports n/a(reason)
reason: null
