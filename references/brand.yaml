# CompleteTech showcase brand config: THE single place for brand data (spec A3).
# Every colour, font, logo path, eyebrow, company label and footer string a generator uses comes from here.
# Repo files (.github/showcase.yml) and CLI flags may override content only, never colours or fonts.
# After editing, regenerate the stdlib lock copy:  python3 scripts/showcase.py config --write-lock
schema_version: 1
standard: ct-std-v1

brand_strings:
  company: CompleteTech LLC
  short: CompleteTech
  tagline: Innovation at Every Integration
  website: https://www.complete.tech
  demo_client: Northwind Trading Co.
  demo_owner: Northwind-Trading-Co

brand_assets:
  logo_light: assets/brand/logo.png
  logo_dark: assets/brand/logo-dark.png
  logo_dark_candidate: assets/brand/logo-dark-full.png
  dark_master: current            # current | candidate  (decision 19: flip after the user confirms)
  mark_dark: assets/brand/mark-dark.png   # optional until the estate planner commits the re-measured crop
  mark_light: assets/brand/mark-light.png   # cloud-and-bulb crop of logo.png for icon boxes under 200 px (proposal: §9.1 rule 2 approval pending)
  bulb_dark: assets/brand/bulb-dark.png     # bulb only, cloud stroke removed by the mask (needs pilot approval, STANDARD §9.2)
  # STANDARD §9.2 crop boxes [x0, y0, x1, y1] on the dark master chosen in q26 `logo` (decision 19). Phase 0.12 re-measures
  # them on that master (never reuse old coordinates), sets measured: true, then runs `showcase.py config --crop`,
  # which writes mark_dark and bulb_dark from these boxes. The v1 boxes (697, 26, 1681, 669) and (984, 121, 1442, 653)
  # fit only the 2400x1198 logo-dark.png and are deliberately not filled in.
  crops:
    measured: false
    mark_dark: null
    bulb_dark: null
    bulb_mask: {b_min: 150, r_max: 80, b_minus_g_min: 20}   # alpha 0 where B >= b_min and R <= r_max and B - G >= min

footer:
  href: https://www.complete.tech
  logo_light_url: https://raw.githubusercontent.com/CompleteTech-LLC/.github/main/brand/logo.png
  logo_dark_url: https://raw.githubusercontent.com/CompleteTech-LLC/.github/main/brand/logo-dark.png
  alt: CompleteTech LLC
  width: 200
  line_prefix: Built by
  line_suffix: "· Innovation at Every Integration"

fonts:
  poppins-regular: Poppins-Regular.ttf
  poppins-medium: Poppins-Medium.ttf
  poppins-semibold: Poppins-SemiBold.ttf
  mono-regular: JetBrainsMono-Regular.ttf
  mono-medium: JetBrainsMono-Medium.ttf
  mono-bold: JetBrainsMono-Bold.ttf
  fraunces-semibold: Fraunces-SemiBold.ttf
  bricolage-medium: BricolageGrotesque-Medium.ttf
  pressstart: PressStart2P-Regular.ttf

# README scaffolding answers from the review page (defaults shown; change a value only after the user's answer).
readme:
  nav_first: false            # q57 nav: false = hero banner, then nav line, then title block; true = "Nav line first"
  preserve_banner: above      # q57 pres: above = hero inserted above a preserve-list README's own banner (kept under it);
                              #           unchanged = "Leave them unchanged" (no hero; banner n/a, `preserve-list`)
  fork_readme: note           # q27: note = upstream README kept under the hero banner and the §7.4 G note, then the
                              #       footer; full = "Full CompleteTech treatment" (the repo's §5.4 variant via --variant)
# q57 aia ("Own palette in the same layout", the default) needs no switch: AI-Ascension keeps its `ai-ascension`
# family palette and gets the hero above its existing <picture> banner. "CompleteTech palette" = set the AI-Ascension
# org row's `family: completetech`.

# Review surfaces for contact sheets (GitHub page colours; proofing only, never painted into assets).
review:
  bg_dark: "#0D1117"
  bg_light: "#FFFFFF"
  label_dark: "#8B949E"
  label_light: "#57606A"

# shields.io badge tokens (§7.2), hex without '#'
badges:
  accent: 1E3A8A
  brand: 005ADD
  positive: "067647"
  neutral: 64748B
  label: null
  local_label_bg: "#555555"   # --badges local: label side (shields default)
  local_text: "#FFFFFF"

# Contrast candidates for an omitted chip fg (A3.3)
contrast_candidates: ["#0F172A", "#FFFFFF", "#1E1E1E"]

# GitHub linguist colours (data, not brand) for the card language dot
languages:
  Python: "#3572A5"
  TypeScript: "#3178C6"
  JavaScript: "#F1E05A"
  Go: "#00ADD8"
  Rust: "#DEA584"
  PHP: "#4F5D95"
  Shell: "#89E051"
  PowerShell: "#012456"
  HTML: "#E34C26"
