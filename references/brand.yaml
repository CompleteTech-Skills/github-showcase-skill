  C: "#555555"
  C++: "#F34B7D"
  C#: "#178600"
  Java: "#B07219"
  Kotlin: "#A97BFF"
  Swift: "#F05138"
  Lua: "#000080"
  GDScript: "#355570"
  Jupyter Notebook: "#DA5B0B"
  Dockerfile: "#384D54"
  Vue: "#41B883"
  Svelte: "#FF3E00"
  Astro: "#FF5A03"
  Mermaid: "#FF3670"
  default: "#94A3B8"

# Defaults every family inherits (deep merge) before its own block applies.
defaults:
  measured: true
  hold: false
  banner: generate                  # generate | keep-existing
  company_label: COMPLETETECH LLC
  eyebrow_case: upper               # upper | asis
  # gradient-grid: vertical base, then a horizontal #1E3A8A lift (0 -> 55%) measured on the decision 13 golden
  canvas: {kind: gradient-grid, from: "#0F172A", to: "#001F3F", grid: "#1E3A8A", grid_opacity: 0.25, grid_pitch: 32,
           overlay: {color: "#1E3A8A", from: 0.0, to: 0.55}}
  tokens:
    eyebrow: "#00A7FD"
    title: "#F1F5F9"
    subtitle: "#CBD5E1"
    body: "#CBD5E1"
    muted: "#94A3B8"
    ink: "#0F172A"
    plate_low: "#001F3F"
    card_fill: "#F8FAFC"
    card_ink: "#0F172A"           # wordmark ink on the icon card (T2 dark plates use their title colour)
    card_edge: "#E2E8F0"
    card_shadow: {dx: 6, dy: 8, blur: 12, color: "#000000", opacity: 0.35}
    chip_key: {bg: "#FFC300", fg: "#0F172A"}
    chip_attr: {bg: "#005ADD", fg: "#FFFFFF"}
    bar: {from: "#005ADD", to: "#005ADD", height: 6}
    edge: {color: "#00A7FD", opacity: 0.28}
    gold_trace: "#FFC300"
    accent: "#00A7FD"
    accent_mid: "#0081ED"
    accent_deep: "#005ADD"
    signal_core: "#E0F4FF"
  fonts:
    eyebrow: poppins-semibold
    title: mono-bold
    subtitle: poppins-regular
    chip: poppins-semibold
    card_name: mono-medium
    card_body: poppins-regular
    card_chip_key: poppins-semibold
    card_chip_attr: poppins-medium
    display: poppins-semibold
    tagline: mono-medium

