      title: "#EDE4D3"
      subtitle: "#EDE4D3"
      body: "#EDE4D3"
      muted: "#C9BFAE"
      plate_low: "#2A241C"
      card_fill: "#EDE4D3"
      card_edge: "#C9BFAE"
      chip_key: {bg: "#F2B75C", fg: "#15120E"}
      chip_attr: {bg: "#E39B3A", fg: "#15120E"}
      bar: {from: "#F2B75C", to: "#E39B3A", height: 6}
      edge: {color: "#F2B75C", opacity: 0.28}
      gold_trace: "#F2B75C"
      accent: "#F2B75C"
      accent_mid: "#E39B3A"
      accent_deep: "#E39B3A"
      signal_core: "#FFF4E0"
