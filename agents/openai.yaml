interface:
  display_name: "GitHub Showcase Skill"
  short_description: "Make any GitHub repo, org, project or Enterprise match its owner's brand"
  default_prompt: "Use $github-showcase-skill to generate the hero banner and repo card for this repository and bring its README, description, topics, labels, links and images to the estate standard in the operator's configured brand (the brand config passed with --config; an owner without a row renders neutrally under its own name), so it matches the rest of its owner's repositories; for an org, GitHub Project board or Enterprise, use its org, project or enterprise commands to print the plan and writer jobs, without writing to GitHub."

policy:
  allow_implicit_invocation: true
